# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"
  # - add every other setup step here, in order (env vars, downloads, etc.)

run_commands:
  - "python src/main.py --help"
  # - the real command(s) that actually run your solution

test_commands: []
  # optional -- commands that run your own tests/checks, if you have any

notes: ""
  # anything we should know before running this (e.g. "needs a GPU",
  # "takes about 10 minutes", "expects a sample dataset already present
  # under data/, see docs/ for where to get it")
